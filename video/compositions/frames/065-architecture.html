  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      tl.to(cam, { cx: 975, cy: 316, s: 1.45, duration: 1.4, ease: "expo.inOut", onUpdate: render }, 12.7);
      tl.to(cam, { cx: 970, cy: 420, s: 1.55, duration: 1.3, ease: "expo.inOut", onUpdate: render }, 20.0);

      function prep(el) {

      }
      function rise(el, at, d, y) {

      }
      function pop(el, at) {
        tl.fromTo(el, { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.6)" }, at);
      }
      function shell(id, at, x) {
        tl.fromTo($(id), { opacity: 0, y: 28, x: x || 0, scale: 0.97 }, { opacity: 1, y: 0, x: 0, scale: 1, duration: 0.7, ease: "power3.out" }, at);
      }
      function ghostOut(id, at) {
        tl.to($(id), { opacity: 0, duration: 0.4, ease: "power1.out" }, at);
      }
      function flash(id, at) {
        var el = $(id);
        tl.to(el, { borderColor: ACC, boxShadow: "0 0 50px rgba(61,123,255,0.35)", duration: 0.25, ease: "power2.out" }, at);
        tl.to(el, { borderColor: LINE, boxShadow: "0 40px 60px rgba(7,13,25,0.6)", duration: 0.6, ease: "power2.inOut" }, at + 0.35);
      }
      // wire: draw rail then chevron(s)
      function wire(n, at, d, chevs) {
        var r = $("arch-" + n);
        prep(r);
        draw(r, at, d);
        for (var i = 0; i < chevs.length; i++) {
          var c = $("arch-" + chevs[i]);
          prep(c);
          draw(c, at + d * 0.7 + i * 0.05, 0.25);
        }
      }

      /* pulse travelling along wires; hidden while "inside" a box */
      function travel(gid, wid, at, dur, rev) {
        var g = $(gid), p = $(wid), L = p.getTotalLength(), o = { u: 0 };
        tl.set(g, { opacity: 1 }, at);
        tl.to(o, { u: 1, duration: dur, ease: "power1.inOut", onUpdate: function () {
          var pt = p.getPointAtLength((rev ? 1 - o.u : o.u) * L);
          g.setAttribute("transform", "translate(" + pt.x.toFixed(1) + " " + pt.y.toFixed(1) + ")");
        } }, at);
        tl.set(g, { opacity: 0 }, at + dur);
      }

      /* ================= WIREFRAME SCAFFOLD (waterfall-entry, binary opacity, one direction) ================= */
      var gh = ["users", "ui", "api", "core", "answer", "evidence", "memory"];
      var gt = [0.12, 0.3, 0.46, 0.6, 0.72, 0.82, 0.9];
      var gy = [70, 56, 50, 80, 56, 48, 44];
      var gd = [0.3, 0.28, 0.26, 0.3, 0.24, 0.22, 0.22];
      for (var i = 0; i < gh.length; i++) {
        tl.set($("arch-g-" + gh[i]), { opacity: 1, y: gy[i] }, gt[i]);
        tl.to($("arch-g-" + gh[i]), { y: 0, duration: gd[i], ease: "power4.out" }, gt[i]);
      }
      // initial hidden state of ghosts before their set (seek-safe)
      for (var j = 0; j < gh.length; j++) tl.set($("arch-g-" + gh[j]), { opacity: 0 }, 0);

      /* ================= ambience ================= */
      var glow = $("arch-glow"), gp = { p: 0 };
      tl.to(gp, { p: Math.PI * 2 * 4, duration: DUR, ease: "none", onUpdate: function () {
        glow.style.opacity = String(0.14 + Math.sin(gp.p) * 0.04);
      } }, 0);

      /* ================= USERS + UI + API (2.1 - 5.6) ================= */
      shell("arch-b-users", 2.05); ghostOut("arch-g-users", 2.2);
      rise($("arch-users-h"), 2.3, 0.5, 12);
      for (var u = 0; u < 3; u++) rise($("arch-u" + u), 2.4 + u * 0.14, 0.5, 14);
      wire("w1", 2.75, 0.4, ["k1"]);
      travel("arch-pa", "arch-w1", 2.8, 0.4);

      shell("arch-b-ui", 2.8); ghostOut("arch-g-ui", 2.95);
      rise($("arch-ui-h"), 2.95, 0.5, 12);
      var uic = $$(".arch-uic"), uid = [3.25, 3.55, 3.4, 3.7];

      flash("arch-b-evidence", 10.3);
      // 47,177 count-up on "forty-seven thousand ... evidence"

      rise($("arch-me-cap2"), 31.95, 0.5, 8);

      }
      tl.fromTo($("arch-split"), { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 32.55);
      flash("arch-b-memory", 32.9);

      /* ================= ANSWER (33.2 - 34.7) — whole map built by 34.7 ================= */
      wire("w6", 33.2, 0.35, ["k6"]);
      travel("arch-pb", "arch-w6", 33.2, 0.4);
      shell("arch-b-answer", 33.5); ghostOut("arch-g-answer", 33.65);
      rise($("arch-an-h"), 33.8, 0.5, 12);
      var arT = [34.0, 34.2, 34.4, 34.6];

      var bars = $$(".arch-bar");

      for (var vv = 0; vv < vbs.length; vv++) tl.fromTo(vbs[vv], { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "power3.out" }, 34.3 + vv * 0.06);
      var cites = $$(".arch-cite");
      pop(cites[0], 34.5); pop(cites[1], 34.65);
      tl.fromTo($("arch-okbadge"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.6)" }, 34.7);
      var okp = $("arch-okpath");
      prep(okp);
      draw(okp, 34.85, 0.4);

      // VO-synced spotlight on the answer rows during the hold: visual / sources / conflicts
      function spot(id, at) {
        tl.to($(id), { backgroundColor: "rgba(61,123,255,0.14)", duration: 0.25, ease: "power2.out" }, at);
        tl.to($(id), { backgroundColor: "rgba(61,123,255,0)", duration: 0.7, ease: "power2.inOut" }, at + 0.5);
      }
      spot("arch-ar1", 35.17);
      spot("arch-ar2", 35.94);
      spot("arch-ar3", 37.01);

      /* ================= FINAL HOLD: data pulse loops the full path ================= */
      // pass A: users -> UI -> API -> planner -> validator -> router -> answer
      function pass(g, t0, k) {
        var sp = [["arch-w1", 0.3], ["arch-w2", 0.3], ["arch-w3", 0.75], ["arch-w4", 0.28], ["arch-w5", 0.24], ["arch-w6", 0.3]];
        var t = t0, boxes = ["arch-b-ui", "arch-b-api", "arch-b-planner", "arch-b-validator", "arch-b-router", "arch-b-answer"];
        for (var s = 0; s < sp.length; s++) {
          travel(g, sp[s][0], t, sp[s][1] * k);
          flash(boxes[s], t + sp[s][1] * k);
          t += sp[s][1] * k + 0.1 * k;
        }
        return t;
      }
      pass("arch-pa", 34.9, 0.8);
      // second pulse starts the loop again while a third visits evidence + memory
      pass("arch-pb", 36.4, 0.8);
      travel("arch-pc", "arch-s0", 35.9, 0.4);
      travel("arch-pc", "arch-s2", 36.5, 0.4, true);
      travel("arch-pc", "arch-s3", 37.2, 0.4);

      // keep the timeline spanning the full scene
      tl.to({}, { duration: 0.01 }, DUR - 0.01);
      render();
    })();
