  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const $ = (s) => document.querySelector(s);

    // ---- stage geometry -------------------------------------------------
    const C = [
      { W: 980,  H: 568, cx: 900, cy: 555, crop: 0.61, tw: 700, gx: 530,  gy: 400, tIn: 0.10, dur: 0.85 },
      { W: 980,  H: 483, cx: 900, cy: 555, crop: 0.79, tw: 600, gx: 1390, gy: 400, tIn: 3.55, dur: 0.95 },
      { W: 620,  H: 581, cx: 900, cy: 555, crop: 0.655, tw: 407, gx: 530, gy: 760, tIn: 5.90, dur: 0.95 },
      { W: 1180, H: 373, cx: 800, cy: 555, crop: 1.0,  tw: 780, gx: 1390, gy: 760, tIn: 8.00, dur: 0.90 },
    ];
    // recede ages: [apparent width, centre x, centre y, opacity]
    const AGE = [[440, 270, 590, 0.6], [350, 175, 545, 0.34], [270, 105, 500, 0.2]];
    
    C.forEach((c, i) => {
      const slot = $("#v-s" + i);
      gsap.set(slot, { x: 640, y: 0, z: -420, rotationY: -70, scale: 0.8, opacity: 0 });
    });
    gsap.set(["#v-l0", "#v-l1", "#v-l2", "#v-l3"], { opacity: 0 });
    gsap.set(["#v-k0a", "#v-k0b", "#v-k1", "#v-k2", "#v-k3"], { opacity: 0, scale: 0.85, transformOrigin: "0% 50%" });
    gsap.set([".v-ring"], { opacity: 0, transformOrigin: "50% 50%" });
    gsap.set([".v-panel"], { opacity: 0, scale: 0.96 });
    gsap.set("#v-head .w", { opacity: 0, y: 40, filter: "blur(10px)" });

    // measure every svg stroke for the draw-on (evidence threads + frames)
    const draws = ["#v-t0", "#v-t1", "#v-t2", "#v-t3", "#v-f1", "#v-f2", "#v-f3"];
    draws.forEach((s) => {
      const p = $(s); const len = Math.ceil(p.getTotalLength ? p.getTotalLength() : 600) + 2;
      p.style.strokeDasharray = len; p.style.strokeDashoffset = len; p.dataset.len = len;
    });
    const draw = (sel, at, d, ease) => tl.fromTo(sel, { strokeDashoffset: (i, el) => Number(el.dataset.len) }, { strokeDashoffset: 0, duration: d, ease: ease || "power2.out" }, at);
    const pulse = (sel, at, n) => {
      for (let k = 0; k < n; k++) {
        tl.fromTo(sel, { scale: 0.7, opacity: 0.95 }, { scale: 2.6, opacity: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, at + k * 0.5);
      }
    };

    // ---- ambient ---------------------------------------------------------
    tl.fromTo("#v-glow", { opacity: 0.45, scale: 0.95 }, { opacity: 0.8, scale: 1.08, duration: 7, ease: "sine.inOut" }, 0);
    tl.to("#v-glow", { opacity: 0.55, scale: 1.0, duration: 7.5, ease: "sine.inOut" }, 7);
    tl.fromTo("#v-g1", { x: 0 }, { x: 140, duration: 14.5, ease: "none" }, 0);
    tl.fromTo("#v-g2", { x: 0 }, { x: -160, duration: 14.5, ease: "none" }, 0);
    tl.fromTo("#v-g3", { x: 0 }, { x: -120, duration: 14.5, ease: "none" }, 0);

    // camera: slow push, then relax into the grid, then breathe on the hold
    tl.fromTo("#v-cam", { scale: 1 }, { scale: 1.04, duration: 9.8, ease: "none" }, 0);
    tl.to("#v-cam", { scale: 1, duration: 1.0, ease: "power2.inOut" }, 9.85);
    tl.to("#v-cam", { scale: 1.03, duration: 3.65, ease: "none" }, 10.85);

    // ---- card entries (orbit-3d-entry flip, settle with slight tilt) ----------
    C.forEach((c, i) => {
      const slot = "#v-s" + i;
      tl.to(slot, { opacity: 1, duration: 0.35, ease: "power1.out" }, c.tIn);
      tl.to(slot, { x: 0, y: 0, z: 0, rotationY: -4, scale: 1, duration: c.dur, ease: "back.out(1.25)" }, c.tIn);
      // question label lands with the card
      tl.fromTo("#v-l" + i, { opacity: 0, y: 14, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, y: 0, clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power3.out" }, c.tIn + 0.3);
    });

    // ---- recede into the stack (split-tilt: older windows turn to face the hero) ----
    const FADE = ["#v-k0a, #v-k0b, #v-t0", "#v-k1, #v-t1, #v-f1", "#v-k2, #v-t2, #v-f2"];
    for (let n = 1; n < 4; n++) {
      const t = C[n].tIn;
      for (let j = 0; j < n; j++) {
        const age = n - j, c = C[j];
        const [aw, ax, ay, ao] = AGE[age - 1];
        tl.to("#v-s" + j, { x: ax - c.cx, y: ay - c.cy, z: -200 - 60 * age, rotationY: 30 + 4 * age, scale: aw / c.W, opacity: ao, duration: 0.95, ease: "power3.inOut" }, t);
      }
      tl.to(FADE[n - 1] + ", #v-l" + (n - 1), { opacity: 0, duration: 0.3, ease: "power1.in" }, t - 0.05);
    }

    // ---- callouts: evidence threads + pulses, on the voice cues ---------------
    // line chart: lands on "line chart" (~2.5s)
    tl.to("#v-k0a", { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 2.55);
    pulse("#v-r0a", 2.55, 2); pulse("#v-r0b", 2.65, 2);
    draw("#v-t0", 2.75, 0.6);
    tl.to("#v-k0b", { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 3.2);
    // bar chart: lands on "bar chart" (~4.5-5.1s)
    draw("#v-f1", 4.5, 0.7);
    draw("#v-t1", 5.05, 0.4);
    tl.to("#v-k1", { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 5.3);
    // map: pins pulse, coordinate frame draws (it is a coordinate plot, not a basemap)
    draw("#v-f2", 6.85, 0.7);
    ["#v-r2a", "#v-r2b", "#v-r2c", "#v-r2d"].forEach((s, k) => pulse(s, 7.0 + k * 0.18, 1));
    draw("#v-t2", 7.35, 0.35);
    tl.to("#v-k2", { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 7.55);
    // heatmap: lands on "heatmap" (~8.4-9s)
    draw("#v-f3", 8.75, 0.7);
    draw("#v-t3", 9.2, 0.3);
    tl.to("#v-k3", { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 9.35);

    // ---- end beat: all four fan out to the 2x2 grid (card-morph-anchor: uniform scale + crop) ----
    const GT = 9.85;
    tl.to("#v-k3, #v-f3, #v-t3, #v-l3", { opacity: 0, duration: 0.3, ease: "power1.in" }, GT - 0.1);
    tl.to(".v-panel", { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out", stagger: 0.07 }, GT + 0.25);
    C.forEach((c, i) => {
      const s = c.tw / c.W;
      const vy = (c.crop / 2 - 0.5) * c.H;                 // visible-centre offset inside the natural card
      const x = c.gx - c.cx, y = (c.gy - s * vy) - c.cy;
      const tx = GT + i * 0.07;
      tl.to("#v-s" + i, { x, y, z: 0, rotationY: 0, scale: s, opacity: 1, duration: 1.05, ease: "expo.inOut" }, tx);
      tl.fromTo("#v-c" + i, { clipPath: "inset(0% 0% 0% 0% round 22px)" }, { clipPath: "inset(0% 0% " + ((1 - c.crop) * 100) + "% 0% round " + (20 / s) + "px)", duration: 1.05, ease: "expo.inOut" }, tx);
      // slow float on the hold (counter-phase)
      const dir = i % 2 ? -1 : 1;
      tl.to("#v-s" + i, { y: y - 5 * dir, duration: 1.4, ease: "sine.inOut" }, 11.4 + i * 0.05);
      tl.to("#v-s" + i, { y: y + 4 * dir, duration: 1.6, ease: "sine.inOut" }, 12.8 + i * 0.05);
    });
    // headline lands on "the question"
    tl.to("#v-head .w", { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out", stagger: 0.11 }, 10.35);
    // living hold: pulses on the real amber dots / pins inside the scaled grid cards
    pulse("#v-r0a", 11.9, 3); pulse("#v-r0b", 12.0, 3);
    ["#v-r2a", "#v-r2b", "#v-r2c", "#v-r2d"].forEach((s, k) => pulse(s, 12.1 + k * 0.2, 2));
    tl.to(["#v-r0a", "#v-r0b"], { opacity: 0, duration: 0.01 }, 14.4);

    window.__timelines["05-visuals"] = tl;
  </script>
