      function pad(n, w) {

      /* ---------- sunflower layout over the frame (index-derived, no Math.random) ---------- */
      var N = 118;

        var h1 = hash(i, 7),

      tl.fromTo("#f02-field2", { rotationY: -3, rotationX: 1.5, transformOrigin: "50% 50%" }, { rotationY: 3.5, rotationX: -1.5, duration: 17, ease: "none" }, 0);

        tl.fromTo(boxId, Object.assign({ opacity: 0 }, fromProps), { x: 0, y: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, at);

        tl.fromTo(barId, { scaleX: 0 }, { scaleX: 1, duration: dur, ease: "power3.out" }, at + 0.1);

      counter("f02-n2", "f02-b2", "#f02-c2", 5700, T0[1], { x: 0, y: -400 }, 1.5);

          cy2 = by + (hash(q, 28) - 0.5) * 700;
        var p = document.createElementNS(NS, "path");
        p.setAttribute("d", "M " + ax + " " + ay + " C " + cx1 + " " + cy1 + ", " + cx2 + " " + cy2 + ", " + bx + " " + by);
        p.setAttribute("stroke", "#3d7bff");
        p.setAttribute("stroke-opacity", "0.5");
        p.setAttribute("stroke-width", "2.5");
        p.setAttribute("stroke-linecap", "round");
        tg.appendChild(p);
        var len = p.getTotalLength();
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
        tpaths.push(p);
      }
      tpaths.forEach(function (p, k) {
        tl.to(p, { strokeDashoffset: 0, duration: 1.1, ease: "power2.out" }, 7.0 + k * 0.17);
      });

      /* ---------- the question: line cuts in, card, typed text ---------- */
      var ql = $("f02-qline"),
        qlen = ql.getTotalLength();
      ql.style.strokeDasharray = String(qlen);
      ql.style.strokeDashoffset = String(qlen);
      tl.to("#f02-qline", { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 8.6);
      tl.fromTo("#f02-qdot", { scale: 0, opacity: 0, transformOrigin: "400px 470px" }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, 9.0);
      tl.fromTo("#f02-q", { opacity: 0, scale: 0.9, x: -40, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, x: 0, duration: 0.55, ease: "power3.out" }, 8.95);

      var QTEXT = "Which wells in my area were down the longest this summer, and why?";
      var qt = $("f02-qt");
      var chars = [];
      QTEXT.split(" ").forEach(function (word, wi, arr) {
        var wrap = document.createElement("span");
        wrap.style.cssText = "display:inline-block;opacity:1;white-space:nowrap";
        for (var c = 0; c < word.length; c++) {
          var sp = document.createElement("span");
          sp.textContent = word[c];
          var caret = document.createElement("u");
          sp.appendChild(caret);
          wrap.appendChild(sp);
          chars.push(sp);
        }
        qt.appendChild(wrap);
        if (wi < arr.length - 1) qt.appendChild(document.createTextNode(" "));
      });
      var TY0 = 9.5,
        TY_RATE = 0.034;
      chars.forEach(function (sp, k) {
        var at = TY0 + k * TY_RATE;
        tl.set(sp, { opacity: 1 }, at);
        tl.set(sp.firstElementChild, { opacity: 1 }, at);
        tl.set(sp.firstElementChild, { opacity: 0 }, at + TY_RATE);
      });
      var typedEnd = TY0 + chars.length * TY_RATE;
      /* last caret blinks while waiting */
      var lastCaret = chars[chars.length - 1].firstElementChild;
      for (var b = 0; b < 4; b++) {
        tl.set(lastCaret, { opacity: 1 }, typedEnd + b * 0.3);
        tl.set(lastCaret, { opacity: 0 }, typedEnd + b * 0.3 + 0.15);
      }

      /* ---------- swallow: the question is buried, line is lost ---------- */
      tl.to("#f02-q", { scale: 0.96, opacity: 0.45, duration: 0.9, ease: "power2.in" }, 11.7);
      tl.to("#f02-qline", { strokeDashoffset: -qlen, duration: 0.8, ease: "power2.in" }, 11.7);
      tl.to("#f02-qdot", { opacity: 0, duration: 0.4, ease: "power1.in" }, 11.8);

      /* ---------- closing beat: dim everything, amber counters tick ---------- */
      var CL = 12.4;
      tl.to("#f02-scrim", { opacity: 1, duration: 0.9, ease: "power2.out" }, CL);
      tl.to("#f02-c1, #f02-c2, #f02-c3, #f02-c4", { opacity: 0.12, duration: 0.8, ease: "power2.out" }, CL);
      tl.fromTo("#f02-aglow", { opacity: 0, scale: 0.85 }, { opacity: 0.22, scale: 1, duration: 1.2, ease: "power2.out" }, CL + 0.3);
      var aglow = $("f02-aglow");
      var gph = { p: 0 };
      tl.fromTo(gph, { p: 0 }, { immediateRender: false, p: Math.PI * 2 * 1.4, duration: 17 - (CL + 1.5), ease: "none", onUpdate: function () {
        var s = Math.sin(gph.p);
        gsap.set(aglow, { opacity: 0.22 + s * 0.04, scale: 1 + s * 0.02 });
      } }, CL + 1.5);

      /* strips: 28 segments, week separators every 7 */
      function buildStrip(id) {
        var host = $(id),
          segs = [];
        for (var k = 0; k < 28; k++) {
          var d = document.createElement("div");
          d.className = "f02-seg";
          d.style.left = k * 42 + Math.floor(k / 7) * 18 + "px";
          d.innerHTML = "<i></i>";
          host.appendChild(d);
          segs.push(d.firstElementChild);
        }
        var scan = document.createElement("div");
        scan.className = "f02-scan";
        host.appendChild(scan);
        return { segs: segs, scan: scan };
      }
      var st1 = buildStrip("f02-s1"),
        st2 = buildStrip("f02-s2");
      function stripTicks(st, at, step) {
        st.segs.forEach(function (seg, k) {
          tl.fromTo(seg, { scaleY: 0 }, { scaleY: 1, duration: 0.22, ease: "power3.out" }, at + k * step);
        });
      }
      function waterfallLabel(id, at) {
        tl.set(id, { opacity: 1, y: 80 }, at);
        tl.to(id, { y: 0, duration: 0.26, ease: "power4.out" }, at);
      }
      tl.fromTo("#f02-s1", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 13.1);
      tl.fromTo("#f02-s2", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 14.45);
      waterfallLabel("#f02-m1l", 12.8);
      stripTicks(st1, 13.2, 0.045);
      waterfallLabel("#f02-m2l", 14.1);
      stripTicks(st2, 14.55, 0.045);
      /* subtitle: for weeks */
      var subs = document.querySelectorAll("#f02-sub span");
      tl.set(subs[0], { opacity: 1, y: 50 }, 15.5);
      tl.to(subs[0], { y: 0, duration: 0.22, ease: "power4.out" }, 15.5);
      tl.set(subs[1], { opacity: 1, y: 60 }, 15.5 + 0.23);
      tl.to(subs[1], { y: 0, duration: 0.24, ease: "power4.out" }, 15.5 + 0.23);
      var sp = $("f02-subpath"),
        splen = sp.getTotalLength();
      sp.style.strokeDasharray = String(splen);
      sp.style.strokeDashoffset = String(splen);
      tl.to("#f02-subpath", { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 15.7);
      /* living hold: scanners sweep along the strips, week blocks keep ticking */
      [st1, st2].forEach(function (st, n) {
        var sph = { p: 0 };
        var HS = 15.6 + n * 0.25;
        tl.fromTo(sph, { p: 0 }, { immediateRender: false, p: 1, duration: 17 - HS, ease: "none", onUpdate: function () {
          var u = (sph.p % 1);
          gsap.set(st.scan, { x: -120 + u * 1360, opacity: 1 });
        } }, HS);
      });

      tl.to({}, { duration: 0.001 }, 16.999);
    })();
  </script>
</template>
