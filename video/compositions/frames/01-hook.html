      tl.to("#f01-cam", { scale: 0.96, duration: 1.3, ease: "expo.inOut" }, B.slam + 0.4);
      tl.to("#f01-cam", { scale: 1.0, duration: 2.6, ease: "power2.inOut" }, B.diff - 0.5);
      tl.to("#f01-cam", { scale: 1.035, duration: 15 - (B.diff + 2.1), ease: "none" }, B.diff + 2.1);

      /* chip: source cite */
      tl.fromTo("#f01-chip", { scale: 0.6, opacity: 0, x: -30, transformOrigin: "0% 50%" }, { scale: 1, opacity: 1, x: 0, duration: 0.55, ease: "back.out(1.6)" }, 0.45);

      /* --- Phase A: wellhead readout counts up (counting-dynamic-scale) --- */
      var COUNT_AT = 0.3,
        COUNT_DUR = 2.3;
      var wnum = $("f01-wnum"),
        wState = { v: 0 },
        ringState = { v: 0 };
      tl.fromTo("#f01-wnum", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, COUNT_AT);
      tl.to(wState, { v: 51.6, duration: COUNT_DUR, ease: "power3.out", onUpdate: function () { wnum.textContent = wState.v.toFixed(1); } }, COUNT_AT);
      tl.fromTo("#f01-wnum", { scale: 0.5 }, { scale: 1, duration: COUNT_DUR, ease: "power3.out" }, COUNT_AT);
      tl.fromTo(ringState, { v: 0 }, { v: 0.516, duration: COUNT_DUR, ease: "power3.out", onUpdate: function () { setArc(wRing, ringState.v); } }, COUNT_AT);
      tl.fromTo("#f01-wdot", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, COUNT_AT + COUNT_DUR - 0.2);
      tl.fromTo("#f01-wlbl", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, COUNT_AT + 0.2);
      tl.fromTo("#f01-wunit", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, COUNT_AT + COUNT_DUR);
      tl.fromTo("#f01-wpill", { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, COUNT_AT + COUNT_DUR + 0.25);
      /* ambient glow bloom: lands with the settle, then breathes */
      var wglow = $("f01-wglow");
      tl.fromTo("#f01-wglow", { opacity: 0, scale: 0.8 }, { opacity: 0.36, scale: 1, duration: 1.2, ease: "power2.out" }, COUNT_AT + COUNT_DUR - 1.0);
      var wph = { p: 0 };
      tl.fromTo(wph, { p: 0 }, { immediateRender: false, p: Math.PI * 2 * 1.2, duration: B.slam - (COUNT_AT + COUNT_DUR + 0.2), ease: "none", onUpdate: function () {
        var s = Math.sin(wph.p);
        gsap.set(wglow, { opacity: 0.36 + s * 0.04, scale: 1 + s * 0.02 });
      } }, COUNT_AT + COUNT_DUR + 0.2);
      /* pill dot pulse */
      tl.fromTo("#f01-wpill i", { opacity: 1 }, { opacity: 0.3, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, COUNT_AT + COUNT_DUR + 0.8);

      /* --- Beat: "It isn't." glow drains, ring drains amber, pulse jolt --- */
      var jolt = B.slam;
      tl.to("#f01-cam", { x: -10, duration: 0.05, ease: "none" }, jolt);
      tl.to("#f01-cam", { x: 8, duration: 0.06, ease: "none" }, jolt + 0.05);
      tl.to("#f01-cam", { x: -4, duration: 0.06, ease: "none" }, jolt + 0.11);
      tl.to("#f01-cam", { x: 0, duration: 0.1, ease: "power2.out" }, jolt + 0.17);
      tl.fromTo("#f01-wglow", { opacity: 0.36 }, { opacity: 0, duration: 0.9, ease: "power2.in", immediateRender: false }, jolt);
      tl.fromTo(ringState, { v: 0.516 }, { v: 0, duration: 0.9, ease: "power2.in", immediateRender: false, onUpdate: function () { setArc(wRing, ringState.v); } }, jolt);
      tl.to("#f01-warc", { stroke: "#f2a33a", duration: 0.2, ease: "none" }, jolt);
      tl.to("#f01-wdot", { fill: "#f2a33a", opacity: 0, duration: 0.8, ease: "power2.in" }, jolt);
      tl.to("#f01-wnum", { color: "#9aa8c0", scale: 0.94, duration: 0.3, ease: "power4.out" }, jolt);
      tl.to("#f01-wpill", { opacity: 0, y: 10, duration: 0.3, ease: "power2.in" }, jolt);
      /* well readout slides left, scaled down, to make room for AIR */
      tl.fromTo("#f01-well", { x: 0, scale: 1, transformOrigin: "50% 50%" }, { x: -440, scale: 0.72, duration: 1.0, ease: "expo.inOut" }, B.slam + 0.7);

      /* --- Phase B: AIR readout whips in and counts --- */
      var anum = $("f01-anum"),
        aState = { v: 0 },
        aRingState = { v: 0 };
      tl.fromTo("#f01-air", { x: 1500, scale: 0.72, opacity: 0, transformOrigin: "50% 50%" }, { x: 440, scale: 0.72, opacity: 1, duration: 0.9, ease: "expo.out" }, B.airIn);
      tl.to(aState, { v: 43.1, duration: 1.6, ease: "power3.out", onUpdate: function () { anum.textContent = aState.v.toFixed(1); } }, B.airIn + 0.1);
      tl.fromTo(aRingState, { v: 0 }, { immediateRender: false, v: 0.431, duration: 1.6, ease: "power3.out", onUpdate: function () { setArc(aRing, aRingState.v); } }, B.airIn + 0.1);
      tl.fromTo("#f01-adot", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, B.airIn + 1.3);
      tl.fromTo("#f01-aunit", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, B.airIn + 1.7);

      /* --- Phase C: minus pops, both readouts collapse into the difference --- */
      tl.fromTo("#f01-minus", { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, B.minus);
      tl.to("#f01-minus", { scale: 1.08, duration: 0.09, ease: "sine.inOut", yoyo: true, repeat: 1 }, B.minus + 0.5);
      tl.fromTo("#f01-well", { filter: "blur(0px)", opacity: 1 }, { x: -340, scale: 0.5, opacity: 0, filter: "blur(10px)", duration: 0.6, ease: "power3.in", immediateRender: false }, B.converge);
      tl.fromTo("#f01-air", { filter: "blur(0px)", opacity: 1 }, { x: -340, scale: 0.5, opacity: 0, filter: "blur(10px)", duration: 0.6, ease: "power3.in", immediateRender: false }, B.converge);
      tl.to("#f01-minus", { scale: 0, rotation: 120, opacity: 0, duration: 0.5, ease: "power3.in" }, B.converge);

      /* difference slam: kinetic-beat-slam entrance + count */
      var dnum = $("f01-dnum"),
        dState = { v: 0 };
      tl.fromTo("#f01-dnum", { scale: 1.7, opacity: 0, filter: "blur(18px)", transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.55, ease: "power4.out" }, B.diff);
      tl.to(dState, { v: 8.5, duration: 0.9, ease: "power3.out", onUpdate: function () { dnum.textContent = "+" + dState.v.toFixed(1); } }, B.diff);
      tl.fromTo("#f01-dlbl", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, B.diff + 0.15);
      tl.fromTo("#f01-dunit", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, B.diff + 0.8);
      var dglow = $("f01-dglow");
      tl.fromTo("#f01-dglow", { opacity: 0, scale: 0.8 }, { opacity: 0.3, scale: 1, duration: 1.2, ease: "power2.out" }, B.diff + 0.2);
      var dph = { p: 0 };
      tl.fromTo(dph, { p: 0 }, { immediateRender: false, p: Math.PI * 2 * 3, duration: 15 - (B.diff + 1.4), ease: "none", onUpdate: function () {
        var s = Math.sin(dph.p);
        gsap.set(dglow, { opacity: 0.3 + s * 0.05, scale: 1 + s * 0.025 });
      } }, B.diff + 1.4);
      /* evidence thread: chip to difference label */
      tl.fromTo("#f01-th1", { strokeDashoffset: $("f01-th1").getTotalLength() }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, B.diff + 0.2);
      tl.fromTo("#f01-th1dot", { scale: 0, opacity: 0, transformOrigin: "620px 222px" }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, B.diff + 0.85);

      /* --- Phase D: ruler under the hero --- */
      tl.fromTo("#f01-rsvg", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, B.ruler);
      tl.to("#f01-rfill", { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" }, B.ruler + 0.1);
      tl.fromTo("#f01-rend", { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, B.ruler + 0.9);
      tl.fromTo("#f01-r85", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, B.ruler + 0.9);
      tl.to("#f01-rthr", { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, B.ruler + 0.45);
      tl.fromTo("#f01-r15", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, B.ruler + 0.7);
      tl.fromTo("#f01-rdash", { opacity: 0 }, { opacity: 0.8, duration: 0.5, ease: "power1.out" }, B.ruler + 0.9);
      tl.to("#f01-rbr", { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, B.ruler + 1.1);
      tl.fromTo("#f01-rshort", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, B.ruler + 1.4);
      tl.fromTo("#f01-rcap", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, B.ruler + 0.75);

      /* --- Stamp: NOT PRODUCING (kinetic slam) --- */
      tl.fromTo("#f01-stamp", { opacity: 0, scale: 2.4, rotation: -14, filter: "blur(18px)", transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, rotation: -4, filter: "blur(0px)", duration: 0.4, ease: "power4.out" }, B.stamp);
      tl.fromTo("#f01-shock", { opacity: 0.55, scale: 1 }, { opacity: 0, scale: 20, duration: 0.9, ease: "power2.out", immediateRender: false }, B.stamp + 0.3);
      tl.to("#f01-cam", { y: 9, duration: 0.05, ease: "none" }, B.stamp + 0.3);
      tl.to("#f01-cam", { y: -6, duration: 0.06, ease: "none" }, B.stamp + 0.35);
      tl.to("#f01-cam", { y: 0, duration: 0.14, ease: "power2.out" }, B.stamp + 0.41);
      tl.to("#f01-stamp", { rotation: -3, duration: 15 - (B.stamp + 0.9), ease: "sine.inOut" }, B.stamp + 0.9);

      /* --- Phase E: manual page sinks into the document stack --- */
      var allBase = base;
      allBase.forEach(function (s, i) {
        tl.fromTo(s, { opacity: 0, y: 160, x: 0, rotation: 0 }, { opacity: 1, y: Number(s.dataset.oy), x: Number(s.dataset.ox), rotation: Number(s.dataset.rot), duration: 0.7, ease: "power3.out" }, B.thread2 + i * 0.1);
      });
      tl.to("#f01-th2", { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, B.thread2 + 0.2);
      tl.fromTo("#f01-th2dot", { scale: 0, opacity: 0, transformOrigin: "1264px 625px" }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, B.thread2 + 0.9);
      tl.fromTo("#f01-manual", { opacity: 0, y: -260, x: 0, rotation: -8, scale: 1 }, { opacity: 1, y: 0, x: 0, rotation: -3, duration: 0.7, ease: "power3.out" }, B.manual);
      tl.to("#f01-manual", { y: 70, scale: 0.94, rotation: 2, duration: 0.9, ease: "power2.inOut" }, B.bury);
      tl.to("#f01-manual", { opacity: 0.55, duration: 0.9, ease: "power2.inOut" }, B.bury + 0.2);
      cover.forEach(function (s, i) {
        tl.fromTo(s, { opacity: 0, y: -340, x: Number(s.dataset.ox) * 0.5, rotation: Number(s.dataset.rot) * 2 }, { opacity: 1, y: Number(s.dataset.oy) + 20, x: Number(s.dataset.ox), rotation: Number(s.dataset.rot), duration: 0.55, ease: "power3.out" }, B.bury + 0.5 + i * 0.28);
      });
      /* docs breathe in the hold */
      var dockPh = { p: 0 };
      tl.fromTo(dockPh, { p: 0 }, { immediateRender: false, p: Math.PI * 2 * 1.0, duration: 15 - (B.thread2 + 1.0), ease: "none", onUpdate: function () {
        gsap.set(docs, { y: Math.sin(dockPh.p) * 5 });
      } }, B.thread2 + 1.0);

      /* keep the timeline exactly 15s long */
      tl.to({}, { duration: 0.001 }, 14.999);
    })();
  </script>
</template>
