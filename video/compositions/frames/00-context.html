        D_DRONE = 1.85;
      function frame() {
        var T = TT.t;
        var d2r = 180 / Math.PI;
        var J = jacks;
        for (var i = 0; i < J.length; i++) {
          var j = J[i];
          var th = TAU * (T / j.o.per) + j.o.ph;
          var r = solve(th);
          j.crank.setAttribute("transform", "rotate(" + (th * d2r).toFixed(2) + " " + CC.x + " " + CC.y + ")");
          j.beam.setAttribute("transform", "rotate(" + (r.b * d2r).toFixed(2) + " 0 " + PV.y + ")");
          j.pit.setAttribute("x1", r.qx.toFixed(1));
          j.pit.setAttribute("y1", r.qy.toFixed(1));
          j.pit.setAttribute("x2", r.tx.toFixed(1));
          j.pit.setAttribute("y2", r.ty.toFixed(1));
          var ax = HR * Math.cos(PHIA + r.b),
            ay = PV.y + HR * Math.sin(PHIA + r.b);
          j.arc.setAttribute("d", "M " + ax.toFixed(1) + " " + ay.toFixed(1) + " A 168 168 0 0 1 168 " + PV.y);
          var cy = CARR0 + HR * r.b;
          j.cab.setAttribute("y2", cy.toFixed(1));
          j.car.setAttribute("y", cy.toFixed(1));
          j.rod.setAttribute("y1", (cy + 9).toFixed(1));
          if (j === hero) {
            var dlt = cy - CARR0;
            underRod.setAttribute("y2", (1050 + dlt).toFixed(1));
            plunger.setAttribute("y", (1046 + dlt).toFixed(1));
          }
        }
        /* oil droplets drifting into the bore */
        for (var k = 0; k < droplets.length; k++) {
          var u = (T * 0.2 + k / droplets.length) % 1;
          var x0 = HX + (k % 2 ? 1 : -1) * (90 + ((k * 47) % 260));
          var dxk = HX + (x0 - HX) * (1 - u);
          var dyk = 1124 - u * 32;
          droplets[k].setAttribute("cx", dxk.toFixed(1));
          droplets[k].setAttribute("cy", dyk.toFixed(1));
          droplets[k].setAttribute("fill-opacity", (Math.sin(Math.PI * u) * 0.9).toFixed(3));
        }
        /* drone: position along the route, bob, rotors, cone */
        var p = eio2((T - T0_DRONE) / D_DRONE);
        var len = p * routeLen;
        var a = routeVis.getPointAtLength(len);
        var b = routeVis.getPointAtLength(Math.min(routeLen, len + 5));
        var ang = Math.atan2(b.y - a.y, b.x - a.x) * d2r;
        var relax = 1 - clamp01((p - 0.9) / 0.1);
        var tilt = ang * 0.3 * relax;
        var bobY = Math.sin(T * 2.2) * 4,
          bobX = p >= 1 ? Math.sin(T * 1.3 + 1) * 3 : 0;
        var dxp = a.x + bobX,
          dyp = a.y + bobY;
        drone.setAttribute("transform", "translate(" + dxp.toFixed(1) + " " + dyp.toFixed(1) + ") rotate(" + tilt.toFixed(2) + ") scale(" + DRONE_S + ")");
        routeMp.style.strokeDashoffset = (routeLen * (1 - p)).toFixed(1);
        var cs = Math.abs(Math.cos(T * 43)) * 22 + 2;
        bladeL.setAttribute("d", "M " + (-50 - cs) + " -26 H " + (-50 + cs));
        bladeR.setAttribute("d", "M " + (50 - cs) + " -26 H " + (50 + cs));
        var apx = dxp,
          apy = dyp + 15 * DRONE_S;
        coneP.setAttribute("d", "M " + apx.toFixed(1) + " " + apy.toFixed(1) + " L " + (CAPX - 56) + " " + CAPY + " A 56 15 0 0 0 " + (CAPX + 56) + " " + CAPY + " Z");
        var su = ((T - 17.4) / 0.8) % 1;
        if (su < 0) su = 0;
        sweep.setAttribute("cx", (apx + (CAPX - apx) * su).toFixed(1));
        sweep.setAttribute("cy", (apy + (CAPY - apy) * su).toFixed(1));
        sweep.setAttribute("rx", (2 + 54 * su).toFixed(1));
        sweep.setAttribute("ry", (1 + 14 * su).toFixed(1));
        sweep.setAttribute("stroke-opacity", (T < 17.4 ? 0 : 0.85 * (1 - su * 0.6)).toFixed(3));
        applyCamera();
      }
      tl.to(TT, { t: 30, duration: 30, ease: "none", onUpdate: frame }, 0);
      frame();

      /* ======================= AMBIENT ======================= */
      var ghostIds = ["WELL-0001", "T200", "INS-0001-0203", "WELL-0007", "MNT-0151-025", "CTX-0001-003", "WELL-0012", "INS-0001-0140", "WELL-0003", "T200", "WELL-0021", "CTX-0001-003"];
      var gl = $("f00-ghosts");
      ghostIds.forEach(function (txt, i) {
        var d = document.createElement("div");
        d.className = "f00-ghost";
        d.setAttribute("data-layout-allow-overlap", "");
        d.setAttribute("data-layout-allow-occlusion", "");
        d.textContent = txt;
        d.style.left = 80 + ((i * 337) % 1500) + "px";
        d.style.top = 60 + ((i * 211) % 820) + "px";
        gl.appendChild(d);
        tl.fromTo(d, { y: 0 }, { y: i % 2 ? -90 : 70, duration: 30, ease: "none" }, 0);
      });
      tl.fromTo("#f00-grid", { x: 0, y: 0 }, { x: 96, y: 96, duration: 30, ease: "none" }, 0);
      var gph = { p: 0 };
      tl.fromTo(gph, { p: 0 }, { p: TAU * 6, duration: 30, ease: "none", immediateRender: false, onUpdate: function () {
        $("f00-glow").style.opacity = String(0.8 + Math.sin(gph.p) * 0.12);
      } }, 0);

      /* ======================= BEAT 1: "Picture an oil field" ======================= */
      var hs = $("f00-horizon");
      var hLen = 3400;
      hs.style.strokeDasharray = String(hLen);
      hs.style.strokeDashoffset = String(hLen);
      /* the line starts off-screen left (x=-700); draw it left to right so it sweeps across the frame */
      tl.to(hs, { strokeDashoffset: 0, duration: 2.2, ease: "power2.out" }, 0.0);

      function jackIn(j, t, dur) {
        tl.fromTo(j.wrap, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: dur, ease: "power3.out" }, t);
      }
      jackIn(hero, 0.0, 0.6);
      jackIn(nearA, 0.5, 0.7);
      jackIn(nearC, 0.8, 0.7);
      jackIn(nearD, 1.1, 0.7);
      farJacks.forEach(function (j, i) {
        jackIn(j, 1.3 + i * 0.25, 0.7);
      });
      tinyJacks.forEach(function (j, i) {
        jackIn(j, 2.45 + i * 0.11, 0.5);
      });
      [lblH, lblA, lblC, lblD].forEach(function (t, i) {
        tl.fromTo(t, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.2 + i * 0.2);
      });
      /* labels of the side wells step aside when the cutaway opens */
      [lblA, lblC, lblD].forEach(function (t) {
        tl.to(t, { opacity: 0.25, duration: 0.6, ease: "power2.out" }, 6.8);
      });

      /* ======================= BEAT 1b: "pump jack" chip ======================= */
      function chipIn(sel, t) {
        tl.fromTo(sel, { opacity: 0, scale: 0.6, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, t);
      }
      function chipOut(sel, t) {
        tl.to(sel, { opacity: 0, duration: 0.4, ease: "power2.in" }, t);
      }
      function leaderIn(L, t, dur) {
        tl.to(L.p, { strokeDashoffset: 0, duration: dur, ease: "power2.out" }, t);
        tl.fromTo(L.d0, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, t);
        tl.fromTo(L.d1, { opacity: 0, attr: { r: 0 } }, { opacity: 1, attr: { r: 6 }, duration: 0.4, ease: "back.out(1.6)" }, t + dur - 0.1);
      }
      function leaderOut(L, t) {
        tl.to([L.p, L.d0, L.d1], { opacity: 0, duration: 0.4, ease: "power2.in" }, t);
      }
      chipIn("#f00-c-jack", 4.55);
      leaderIn(ldJack, 4.7, 0.6);

      /* ======================= BEAT 2: cutaway, bore, reservoir ======================= */
      tl.fromTo("#f00-cutrect", { attr: { height: 0 } }, { attr: { height: 470 }, duration: 1.1, ease: "power2.inOut" }, 6.8);
      var outLen = outline.getTotalLength();
      outline.style.strokeDasharray = String(outLen);
      outline.style.strokeDashoffset = String(outLen);
      tl.to(outline, { strokeDashoffset: 0, duration: 1.1, ease: "power2.out" }, 6.85);
      tl.fromTo("#f00-pool", { opacity: 0.2 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 8.5);
      var peLen = poolEdge.getTotalLength();
      poolEdge.style.strokeDasharray = String(peLen);
      poolEdge.style.strokeDashoffset = String(peLen);
      tl.to(poolEdge, { strokeDashoffset: 0, duration: 1.0, ease: "power2.out" }, 8.5);
      tl.fromTo("#f00-under", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 7.6);
      /* well bore draws down to the reservoir */
      tl.to(boreW, { strokeDashoffset: 0, duration: 1.5, ease: "power2.out" }, 7.4);
      tl.to(boreI, { strokeDashoffset: 0, duration: 1.5, ease: "power2.out" }, 7.5);
      tl.fromTo("#f00-perf", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 8.8);
      /* flow particles */
      tl.fromTo("#f00-flow", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 8.95);
      tl.fromTo(flow, { strokeDashoffset: 0 }, { strokeDashoffset: -2100, duration: 21, ease: "none", immediateRender: false }, 8.95);
      /* labels */
      chipIn("#f00-c-bore", 7.95);
      leaderIn(ldBore, 8.05, 0.6);
      chipIn("#f00-c-res", 8.65);
      leaderIn(ldRes, 8.75, 0.6);
      chipOut("#f00-c-jack", 9.3);
      leaderOut(ldJack, 9.3);
      chipOut("#f00-c-bore", 9.3);
      leaderOut(ldBore, 9.3);
      chipOut("#f00-c-res", 9.3);
      leaderOut(ldRes, 9.3);

      /* ======================= BEAT 3: the wellhead ======================= */
      tl.fromTo("#f00-wh", { opacity: 0, y: 20, scale: 0.96, transformOrigin: "0% 50%" }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 11.9);
      leaderIn(ldHead, 11.95, 0.7);
      tl.fromTo("#f00-capring", { opacity: 0, scale: 0.5, transformOrigin: "50% 50%" }, { opacity: 0.95, scale: 1, duration: 0.5, ease: "power3.out" }, 12.78);
      tl.to("#f00-capring", { scale: 1.22, opacity: 0.45, duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: 3 }, 13.3);
      tl.fromTo("#f00-pipeglow", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 13.95);
      tl.to("#f00-wh", { opacity: 0, y: -10, duration: 0.4, ease: "power2.in" }, 14.7);
      leaderOut(ldHead, 14.7);
      tl.to("#f00-capring", { opacity: 0, duration: 0.4, ease: "power2.in" }, 15.55);

      /* ======================= BEAT 4: the drone and the scan ======================= */
      tl.fromTo("#f00-drone", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 15.1);
      chipIn("#f00-c-route", 15.5);
      tl.fromTo("#f00-coneg", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 17.05);
      tl.fromTo("#f00-ret", { opacity: 0, scale: 1.5, svgOrigin: "968 662" }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 17.2);
      tl.fromTo("#f00-therm", { opacity: 0, scale: 0.6, svgOrigin: "968 655" }, { opacity: 1, scale: 1, duration: 0.9, ease: "power2.out" }, 17.3);
      chipOut("#f00-c-route", 17.7);

      /* thermal readout card */
      tl.fromTo("#f00-th", { opacity: 0, y: 24, scale: 0.96, transformOrigin: "0% 50%" }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power3.out" }, 17.8);
      leaderIn(ldTherm, 17.9, 0.6);
      var thn = $("f00-thn");
      var thS = { v: 0 };
      tl.fromTo(thS, { v: 0 }, { v: 70, duration: 0.9, ease: "power3.out", onUpdate: function () { thn.textContent = String(Math.round(thS.v)); } }, 17.95);
      tl.fromTo("#f00-thfill", { scaleX: 0 }, { scaleX: 0.7, duration: 0.9, ease: "power3.out" }, 17.95);
      tl.to("#f00-th", { opacity: 0, y: -12, duration: 0.35, ease: "power2.in" }, 18.85);
      leaderOut(ldTherm, 18.85);

      /* dim the world behind the comparison card */
      tl.to("#f00-dim", { opacity: 0.74, duration: 0.7, ease: "power2.inOut" }, 18.9);
      tl.to("#f00-coneg", { opacity: 0.4, duration: 0.6, ease: "power2.inOut" }, 18.9);
      tl.to("#f00-therm", { opacity: 0.55, duration: 0.6, ease: "power2.inOut" }, 18.9);

      /* ======================= BEAT 5: warm means working / cooled means stopped ======================= */
      var BAR_MAX = 80;
      /* left panel enters centred, then slides left when the right panel arrives */
      tl.fromTo("#f00-pl", { opacity: 0, y: 30, x: 390, scale: 0.97 }, { opacity: 1, y: 0, x: 390, scale: 1, duration: 0.6, ease: "power3.out" }, 18.9);
      tl.fromTo("#f00-lr1", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 19.7);
      var ln1 = $("f00-ln1"),
        lS = { v: 0 };
      tl.fromTo(lS, { v: 0 }, { v: 70, duration: 1.5, ease: "power3.out", immediateRender: false, onUpdate: function () { ln1.textContent = String(Math.round(lS.v)); } }, 19.75);
      tl.fromTo("#f00-lf1", { scaleX: 0 }, { scaleX: 70 / BAR_MAX, duration: 1.5, ease: "power3.out" }, 19.75);
      tl.fromTo("#f00-lr2", { opacity: 0, x: -24 }, { opacity: 0.4, x: 0, duration: 0.5, ease: "power3.out" }, 20.1);
      tl.to("#f00-lr2", { opacity: 1, duration: 0.4, ease: "power2.out" }, 21.75);
      tl.fromTo("#f00-lr2 .f00-rval", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 21.75);
      tl.fromTo("#f00-lf2", { scaleX: 0 }, { scaleX: 25 / BAR_MAX, duration: 0.7, ease: "power3.out" }, 21.85);
      tl.fromTo("#f00-lmk", { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.5, ease: "power3.out" }, 22.0);
      tl.fromTo("#f00-llab", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 22.5);
      var larrp = $("f00-larrp");
      var laL = larrp.getTotalLength();
      larrp.style.strokeDasharray = String(laL);
      larrp.style.strokeDashoffset = String(laL);
      tl.to(larrp, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 22.8);
      tl.to("#f00-lghost", { opacity: 0, duration: 0.3, ease: "power2.out" }, 23.6);
      tl.fromTo("#f00-lchip", { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.6)" }, 23.6);
      tl.fromTo("#f00-pgl", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power2.out", immediateRender: false }, 23.6);
      tl.to("#f00-pgl", { opacity: 0.55, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 3 }, 24.4);

      /* right panel: the same well after it has cooled */
      tl.to("#f00-pl", { x: 0, duration: 1.0, ease: "expo.inOut" }, 24.3);
      tl.fromTo("#f00-pr", { opacity: 0, x: 140, y: 0, scale: 0.97 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.8, ease: "power3.out" }, 24.5);
      var rn1 = $("f00-rn1"),
        rS = { v: 70 };
      tl.fromTo("#f00-rf1", { scaleX: 70 / BAR_MAX }, { scaleX: 26 / BAR_MAX, duration: 1.3, ease: "power2.inOut" }, 24.8);
      tl.fromTo(rS, { v: 70 }, { v: 26, duration: 1.3, ease: "power2.inOut", immediateRender: false, onUpdate: function () { rn1.textContent = String(Math.round(rS.v)); } }, 24.8);
      tl.to("#f00-rf1", { backgroundColor: ALT, duration: 0.8, ease: "none" }, 25.3);
      tl.to("#f00-rn1", { color: ALT, duration: 0.6, ease: "none" }, 25.6);
      tl.fromTo("#f00-rr1", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 24.6);
      tl.fromTo("#f00-rr2", { opacity: 0, x: -24 }, { opacity: 0.4, x: 0, duration: 0.5, ease: "power3.out" }, 24.9);
      tl.to("#f00-rr2", { opacity: 1, duration: 0.4, ease: "power2.out" }, 25.55);
      tl.fromTo("#f00-rr2 .f00-rval", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 25.55);
      tl.fromTo("#f00-rf2", { scaleX: 0 }, { scaleX: 25 / BAR_MAX, duration: 0.7, ease: "power3.out" }, 25.65);
      tl.fromTo("#f00-rmk", { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.5, ease: "power3.out" }, 25.8);
      tl.fromTo("#f00-rlab", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 26.2);
      var rarrp = $("f00-rarrp");
      var raL = rarrp.getTotalLength();
      rarrp.style.strokeDasharray = String(raL);
      rarrp.style.strokeDashoffset = String(raL);
      tl.to(rarrp, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 26.4);
      tl.to("#f00-rghost", { opacity: 0, duration: 0.3, ease: "power2.out" }, 26.56);
      tl.fromTo("#f00-rchip", { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.6)" }, 26.56);
      tl.fromTo("#f00-pgr", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power2.out" }, 26.56);
      tl.to("#f00-pgr", { opacity: 0.5, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 27.4);

      /* ======================= BEAT 6: "Simple, in theory." ======================= */
      tl.to("#f00-cmp", { scale: 0.24, x: -150, y: 20, duration: 0.7, ease: "power3.inOut" }, 27.62);
      tl.to("#f00-cmp", { opacity: 0, duration: 0.3, ease: "power1.in" }, 28.05);
      tl.fromTo("#f00-lg1", { opacity: 0, x: 24, scale: 0.9, transformOrigin: "100% 50%" }, { opacity: 1, x: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 28.2);
      tl.fromTo("#f00-lg2", { opacity: 0, x: 24, scale: 0.9, transformOrigin: "100% 50%" }, { opacity: 1, x: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 28.35);
      /* the field comes back up out of the dim, then settles toward the next scene's dark stage */
      tl.to("#f00-dim", { opacity: 0.3, duration: 1.1, ease: "power2.inOut" }, 27.7);
      tl.to("#f00-coneg", { opacity: 0.85, duration: 0.8, ease: "power2.inOut" }, 27.9);
      tl.to("#f00-therm", { opacity: 0.85, duration: 0.8, ease: "power2.inOut" }, 27.9);
      tl.to("#f00-dim", { opacity: 0.44, duration: 0.9, ease: "sine.inOut" }, 29.1);

      /* keep the timeline exactly 30s long */
      tl.to({}, { duration: 0.001 }, 29.999);
    })();
  </script>
</template>
