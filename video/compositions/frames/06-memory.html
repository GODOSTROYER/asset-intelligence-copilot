      const parts = [];

        field.appendChild(el);
        const ang = prand(seed + i * 5 + 2) * Math.PI * 2, sp = 320 + prand(seed + i * 7 + 3) * 360;
        parts.push({ el, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp });

        const t = drive.T * FL, fade = Math.min(1, (1 - drive.T) / 0.3);

      } }, at);
    }
